name: Publish release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  setup-variables:
    name: Setup variables for release
    if: github.repository == 'argoproj-labs/clusterprofile-integration-for-argocd'
    runs-on: ubuntu-22.04
    outputs:
      is_latest_release: ${{ steps.var.outputs.is_latest_release }}
      image_name: ${{ steps.var.outputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup variables
        id: var
        run: |
          set -xue
          git fetch --prune --tags --force

          LATEST_RELEASE_TAG=$(git tag --list 'v*' --sort=version:refname | tail -n 1)
          IS_LATEST_RELEASE=false
          if [[ "$LATEST_RELEASE_TAG" == "${GITHUB_REF_NAME}" ]]; then
            IS_LATEST_RELEASE=true
          fi
          echo "is_latest_release=$IS_LATEST_RELEASE" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/argoproj-labs/clusterprofile-integration-for-argocd" >> "$GITHUB_OUTPUT"

  container-image:
    name: Build and push release container image
    needs:
      - setup-variables
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    if: github.repository == 'argoproj-labs/clusterprofile-integration-for-argocd'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.setup-variables.outputs.image_name }}:${{ github.ref_name }}
            ${{ needs.setup-variables.outputs.is_latest_release == 'true' && format('{0}:latest', needs.setup-variables.outputs.image_name) || '' }}
