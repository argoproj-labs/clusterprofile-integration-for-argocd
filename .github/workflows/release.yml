name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-container-image
  cancel-in-progress: false
  queue: max

env:
  HELM_VERSION: v3.18.3
  TRIVY_VERSION: v0.74.0

jobs:
  prepare-release:
    name: Validate release tag
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ github.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Validate and parse release tag
        id: release
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          tag_pattern="^v${number}\\.${number}\\.${number}(-${identifier}(\\.${identifier})*)?$"
          if [[ ! "${GITHUB_REF_NAME}" =~ ${tag_pattern} || ${#GITHUB_REF_NAME} -gt 128 ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix, at most 128 characters, and no build metadata."
            exit 1
          fi
          prerelease=false
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag_name=${GITHUB_REF_NAME}"
            echo "version=${GITHUB_REF_NAME#v}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  container-image:
    name: Scan, publish, and sign release container image
    needs: prepare-release
    outputs:
      image_name: ${{ steps.prepare.outputs.image_name }}
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
      TRIVY_IGNORE_UNFIXED: 'false'
      TRIVY_IGNOREFILE: /dev/null
    steps:
      - name: Set up release build
        id: prepare
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          {
            echo "RELEASE_ARCHIVE=${RUNNER_TEMP}/release-image.tar"
            echo "TRIVY_CONFIG=${RUNNER_TEMP}/release-trivy.yaml"
          } >> "${GITHUB_ENV}"
          printf '{}\n' > "${RUNNER_TEMP}/release-trivy.yaml"

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select latest release
        id: latest-release
        run: |
          remote_tags=$(git ls-remote --tags --refs origin 'v*')
          latest_stable_tag=$(
            {
              awk '{ sub(/^refs\/tags\//, "", $2); print $2 }' <<< "${remote_tags}"
              printf '%s\n' "${RELEASE_TAG}"
            } |
              awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/' |
              LC_ALL=C sort -V | tail -n 1
          )
          is_latest=false
          if [[ "${RELEASE_TAG}" == "${latest_stable_tag}" ]]; then
            is_latest=true
          fi
          echo "is_latest=${is_latest}" >> "${GITHUB_OUTPUT}"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          IMAGE_DESCRIPTION: Argo CD ClusterProfile controller for registering ClusterProfile resources as Argo CD clusters
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          context: git
          images: ${{ steps.prepare.outputs.image_name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{raw}},value=${{ needs.prepare-release.outputs.tag_name }},priority=1000
            type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.tag_name }}
            type=raw,value=latest,enable=${{ steps.latest-release.outputs.is_latest }}
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
          annotations: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

      - name: Validate release image version
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ "${IMAGE_VERSION}" != "${RELEASE_TAG}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} did not produce a matching image version."
            exit 1
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build release image archive
        id: build-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ env.RELEASE_ARCHIVE }}
          sbom: SELECT_CATALOGERS=+go-module-file-cataloger
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes skopeo

      - name: Prepare image scans
        run: |
          source="oci-archive:${RELEASE_ARCHIVE}:${RELEASE_TAG}"
          for arch in amd64 arm64; do
            skopeo --override-os linux --override-arch "${arch}" copy --preserve-digests \
              "${source}" "oci:${RUNNER_TEMP}/scan-${arch}:scan"
          done

      - name: Check amd64 image for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          input: ${{ runner.temp }}/scan-amd64
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: false
          severity: CRITICAL
          format: table
          exit-code: '1'

      - name: Check arm64 image for CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          input: ${{ runner.temp }}/scan-arm64
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: false
          severity: CRITICAL
          format: table
          exit-code: '1'

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        id: publish
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          source="oci-archive:${RELEASE_ARCHIVE}:${RELEASE_TAG}"
          archive_digest=$(skopeo inspect --raw "${source}" | sha256sum | awk '{ print "sha256:" $1 }')
          if [[ "${archive_digest}" != "${IMAGE_DIGEST}" ]]; then
            echo "::error::Image archive digest does not match the build output."
            exit 1
          fi
          while IFS= read -r image_tag; do
            skopeo copy --all --preserve-digests \
              --authfile "${DOCKER_CONFIG:-${HOME}/.docker}/config.json" \
              --digestfile "${RUNNER_TEMP}/published.digest" \
              "${source}" "docker://${image_tag}"
            if [[ "$(cat "${RUNNER_TEMP}/published.digest")" != "${IMAGE_DIGEST}" ]]; then
              echo "::error::Published image digest does not match the scanned image."
              exit 1
            fi
            printf 'Published %s at %s.\n\n' "${image_tag}" "${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${IMAGE_TAGS}"
          echo "digest=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release image
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_NAME: ${{ steps.prepare.outputs.image_name }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

  helm-chart:
    name: Package, push, and sign release Helm chart
    needs:
      - prepare-release
      - container-image
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to ghcr.io for Helm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Login to ghcr.io for cosign
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        env:
          IMAGE_REPOSITORY: ${{ needs.container-image.outputs.image_name }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          yq -i '.image.repository = strenv(IMAGE_REPOSITORY)' \
            charts/argocd-clusterprofile-controller/values.yaml
          mkdir -p "${RUNNER_TEMP}/charts"
          helm package charts/argocd-clusterprofile-controller \
            --version "${RELEASE_VERSION}" \
            --app-version "${RELEASE_VERSION}" \
            --destination "${RUNNER_TEMP}/charts"

      - name: Push Helm chart
        id: push-chart
        env:
          CHART_REGISTRY: oci://${{ needs.container-image.outputs.image_name }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          chart_package="${RUNNER_TEMP}/charts/argocd-clusterprofile-controller-${RELEASE_VERSION}.tgz"
          push_output=$(helm push "${chart_package}" "${CHART_REGISTRY}" 2>&1)

          echo "${push_output}"

          digest=$(awk '/Digest:/ {print $2}' <<< "${push_output}" | tail -n 1)
          if [[ -z "${digest}" ]]; then
            echo "::error::Could not determine Helm chart digest from helm push output."
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign Helm chart
        env:
          CHART_DIGEST: ${{ steps.push-chart.outputs.digest }}
          CHART_REGISTRY: oci://${{ needs.container-image.outputs.image_name }}
        run: |
          chart_repository="${CHART_REGISTRY#oci://}/argocd-clusterprofile-controller"
          cosign sign --yes "${chart_repository}@${CHART_DIGEST}"
          printf 'Published and signed Helm chart %s@%s.\n' "${chart_repository}" "${CHART_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  release-draft:
    name: Generate release notes and create draft
    needs:
      - prepare-release
      - container-image
      - helm-chart
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: cliff.toml
          args: --latest --use-branch-tags --tag "$RELEASE_TAG" --strip header
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: ${{ runner.temp }}/release-notes.md
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

      - name: Create release draft
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ needs.prepare-release.outputs.sha }}
          name: ${{ needs.prepare-release.outputs.tag_name }}
          draft: true
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          append_body: false

      - name: Link release draft
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: printf '[Review release draft](%s)\n' "${RELEASE_URL}" >> "${GITHUB_STEP_SUMMARY}"
