name: Build and publish development artifacts
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

env:
  HELM_VERSION: v3.18.3
  IMAGE_DESCRIPTION: Argo CD ClusterProfile controller for registering ClusterProfile resources as Argo CD clusters
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        context: git
        images: ghcr.io/${{ github.repository }}
        flavor: latest=false
        tags: |
          type=raw,value=${{ github.event_name == 'push' && 'main' || 'dev' }},priority=1000
          type=sha,format=long,prefix=,enable=${{ github.event_name == 'push' }}
        labels: |
          org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
        annotations: |
          org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
    - name: Setup QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
    - name: Build container image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        push: false
        sbom: SELECT_CATALOGERS=+go-module-file-cataloger
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          GIT_COMMIT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

  push:
    name: Publish image and Helm chart
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        context: git
        images: ghcr.io/${{ github.repository }}
        flavor: latest=false
        tags: |
          type=raw,value=main,priority=1000
          type=sha,format=long,prefix=
        labels: |
          org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
        annotations: |
          org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
    - name: Setup QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
    - name: Login to ghcr.io
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push container image
      id: build-and-push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        sbom: SELECT_CATALOGERS=+go-module-file-cataloger
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: |
          VERSION=${{ steps.meta.outputs.version }}
          GIT_COMMIT=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
    - name: Setup Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: ${{ env.HELM_VERSION }}
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Sign development container image
      env:
        IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: |
        cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
    - name: Login to ghcr.io for Helm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "${GITHUB_TOKEN}" | helm registry login ghcr.io \
          --username "${GITHUB_ACTOR}" \
          --password-stdin
    - name: Package Helm chart
      env:
        IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      run: |
        yq -i '.image.repository = strenv(IMAGE_REPOSITORY)' \
          charts/argocd-clusterprofile-controller/values.yaml
        mkdir -p "${RUNNER_TEMP}/charts"
        helm package charts/argocd-clusterprofile-controller \
          --version 0.0.0-main \
          --app-version main \
          --destination "${RUNNER_TEMP}/charts"
    - name: Push Helm chart
      id: push-chart
      run: |
        push_output=$(helm push "${RUNNER_TEMP}/charts/argocd-clusterprofile-controller-0.0.0-main.tgz" \
          "oci://ghcr.io/${GITHUB_REPOSITORY}" 2>&1)

        echo "${push_output}"

        digest=$(awk '/Digest:/ {print $2}' <<< "${push_output}" | tail -n 1)
        if [[ -z "${digest}" ]]; then
          echo "::error::Could not determine Helm chart digest from helm push output."
          exit 1
        fi

        echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
    - name: Sign Helm chart
      env:
        CHART_DIGEST: ${{ steps.push-chart.outputs.digest }}
      run: |
        cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}/argocd-clusterprofile-controller@${CHART_DIGEST}"
