name: Build and publish development artifacts
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read

env:
  HELM_VERSION: v3.18.3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
    - name: Build container image
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        platforms: linux/amd64
        push: false

  push:
    name: Publish image and Helm chart
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Checkout source code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
    - name: Login to ghcr.io
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push container image
      id: build-and-push
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ github.sha }}
          ghcr.io/${{ github.repository }}:main
    - name: Setup Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: ${{ env.HELM_VERSION }}
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Sign development container image
      env:
        IMAGE_DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: |
        cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}"
    - name: Login to ghcr.io for Helm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "${GITHUB_TOKEN}" | helm registry login ghcr.io \
          --username "${GITHUB_ACTOR}" \
          --password-stdin
    - name: Package Helm chart
      env:
        IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      run: |
        yq -i '.image.repository = strenv(IMAGE_REPOSITORY)' \
          charts/argocd-clusterprofile-controller/values.yaml
        mkdir -p "${RUNNER_TEMP}/charts"
        helm package charts/argocd-clusterprofile-controller \
          --version 0.0.0-main \
          --app-version main \
          --destination "${RUNNER_TEMP}/charts"
    - name: Push Helm chart
      id: push-chart
      run: |
        push_output=$(helm push "${RUNNER_TEMP}/charts/argocd-clusterprofile-controller-0.0.0-main.tgz" \
          "oci://ghcr.io/${GITHUB_REPOSITORY}" 2>&1)

        echo "${push_output}"

        digest=$(awk '/Digest:/ {print $2}' <<< "${push_output}" | tail -n 1)
        if [[ -z "${digest}" ]]; then
          echo "::error::Could not determine Helm chart digest from helm push output."
          exit 1
        fi

        echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
    - name: Sign Helm chart
      env:
        CHART_DIGEST: ${{ steps.push-chart.outputs.digest }}
      run: |
        cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}/argocd-clusterprofile-controller@${CHART_DIGEST}"
