name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code_any_changed }}
      helm: ${{ steps.filter.outputs.helm_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Detect changed files
        uses: tj-actions/changed-files@c3a1bb2c992d77180ae65be6ae6c166cf40f857c # v45.0.3
        id: filter
        with:
          files_yaml: |
            code:
              - '**'
              - '!**.md'
              - '!**/*.md'
              - '!docs/**'
              - '!Dockerfile.*'
              - '!charts/**'
            helm:
              - 'charts/**'

  lint:
    name: Lint
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: --timeout 5m0s

  go:
    name: Go
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -cover

      - name: Build manager
        run: go build ./...

  validate-helm-charts:
    name: Validate Helm charts
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.3

      - name: Validate values schema
        run: make validate-values-schema

      - name: Lint Helm charts
        run: make helm-lint

      - name: Validate helm-docs generation
        uses: losisin/helm-docs-github-action@2ccf3e77eb70dc80d62f8cc26f15d0a96b75fef4 # v1.8.0
        with:
          chart-search-root: charts
          fail-on-diff: true
          version: v1.14.2

  e2e:
    name: E2E
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - go
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Setup kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          install_only: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.3

      - name: Setup Argo CD CLI
        env:
          ARGOCD_CLI_VERSION: v3.4.3
        run: |
          curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-linux-amd64"
          curl -sSL -o cli_checksums.txt "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/cli_checksums.txt"
          awk '$2 == "argocd-linux-amd64" { print $1 "  argocd"; found=1 } END { exit found ? 0 : 1 }' cli_checksums.txt > argocd.sha256
          sha256sum -c argocd.sha256
          sudo install -m 0755 argocd /usr/local/bin/argocd

      - name: Verify e2e tools
        run: |
          kind version
          kubectl version --client=true
          helm version --short
          argocd version --client --short
          jq --version

      - name: Run full e2e
        run: make e2e
