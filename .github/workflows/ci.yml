name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
      helm: ${{ steps.filter.outputs.helm_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changed files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          files_yaml: |
            code:
              - '**'
              - '!**.md'
              - '!**/*.md'
              - '!docs/**'
              - '!.markdownlint-cli2.yaml'
              - '!lychee.toml'
              - '!charts/**'
            helm:
              - 'charts/**'
            docs:
              - 'README.md'
              - 'SECURITY.md'
              - 'docs/**'
              - '.markdownlint-cli2.yaml'
              - 'lychee.toml'

  docs:
    name: Documentation
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-24.04
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          # An empty value overrides the action's *.{md,markdown} default so
          # the globs in .markdownlint-cli2.yaml select the files.
          globs: ''

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml README.md SECURITY.md 'docs/**/*.md'

  lint:
    name: Lint
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout 5m0s

  go:
    name: Go
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Run tests
        run: go test ./... -cover

      - name: Build manager
        run: go build ./...

      - name: Validate generated install manifest
        run: make validate-manifests

  validate-helm-charts:
    name: Validate Helm charts
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-24.04
    needs:
      - changes
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.3

      - name: Validate values schema
        run: make validate-values-schema

      - name: Lint Helm charts
        run: make helm-lint

      - name: Validate Helm rendering
        run: make validate-helm-rendering

      - name: Validate helm-docs generation
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: charts
          fail-on-diff: true
          version: v1.14.2

  e2e:
    name: E2E (${{ matrix.install-method }})
    if: >-
      ${{ !cancelled() && !failure() &&
          (needs.changes.outputs.code == 'true' || needs.changes.outputs.helm == 'true') }}
    runs-on: ubuntu-24.04
    needs:
      - changes
      - lint
      - go
    strategy:
      fail-fast: false
      matrix:
        install-method:
          - kustomize
          - helm
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.32.0
          install_only: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.3

      - name: Setup Argo CD CLI
        env:
          ARGOCD_CLI_VERSION: v3.5.1
        run: |
          curl -sSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/argocd-linux-amd64"
          curl -sSL -o cli_checksums.txt "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_CLI_VERSION}/cli_checksums.txt"
          awk '$2 == "argocd-linux-amd64" { print $1 "  argocd"; found=1 } END { exit found ? 0 : 1 }' cli_checksums.txt > argocd.sha256
          sha256sum -c argocd.sha256
          sudo install -m 0755 argocd /usr/local/bin/argocd

      - name: Verify e2e tools
        run: |
          kind version
          kubectl version --client=true
          helm version --short
          argocd version --client --short
          jq --version

      - name: Run full e2e
        env:
          E2E_IMAGE: example.invalid:5000/cpia/controller:e2e-${{ github.sha }}-${{ matrix.install-method }}
        run: make e2e IMG="${E2E_IMAGE}" E2E_INSTALL_METHOD=${{ matrix.install-method }}
