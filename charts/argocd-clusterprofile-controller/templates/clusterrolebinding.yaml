{{- if and .Values.rbac.create (eq (include "argocd-clusterprofile-controller.watchesAllClusterProfiles" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "argocd-clusterprofile-controller.clusterProfileClusterRoleName" . }}
  labels:
    {{- include "argocd-clusterprofile-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "argocd-clusterprofile-controller.clusterProfileClusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ include "argocd-clusterprofile-controller.namespace" . }}
{{- end }}
